name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    name: Windows MSVC x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkg
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install SDL3 and FFmpeg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "sdl3:x64-windows" `
            "ffmpeg:x64-windows" `
            --triplet x64-windows `
            --clean-after-build

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --version
          cl
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_DEFAULT_TRIPLET }}

      - name: Build ${{ env.BUILD_TYPE }}
        shell: pwsh
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Prepare Windows release package
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $vcpkgBin = Join-Path $env:VCPKG_ROOT "installed\x64-windows\bin"

          if (Test-Path $dist) {
            Remove-Item $dist -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dist | Out-Null

          Copy-Item "$env:GITHUB_WORKSPACE\build\Release\avp.exe" `
            "$dist\NakedAVP.exe"

          Get-ChildItem $vcpkgBin -Filter "*.dll" -File |
            Copy-Item -Destination $dist

          @"

          Compiler: Microsoft Visual C++ / Visual Studio 2022 x64
          Runtime: SDL3 + FFmpeg bundled

          Run NakedAVP.exe from this directory.

          Required game data is not included in this package.
          "@ | Set-Content "$dist\README-Windows.txt" -Encoding UTF8

          if (-not (Test-Path "$dist\NakedAVP.exe")) {
            throw "NakedAVP.exe was not produced."
          }

          if (-not (Test-Path "$dist\SDL3.dll")) {
            throw "SDL3.dll was not bundled."
          }

          $ffmpegDlls = Get-ChildItem $dist -Filter "av*.dll" -File
          $ffmpegDlls += Get-ChildItem $dist -Filter "sw*.dll" -File

          if ($ffmpegDlls.Count -eq 0) {
            throw "No FFmpeg runtime DLLs were bundled."
          }

          Write-Host "Windows package contents:"
          Get-ChildItem $dist | Format-Table Name, Length

      - name: Create Windows release ZIP
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "NakedAVP-windows-x64-msvc.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\dist\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "Windows release ZIP was not created."
          }

      - name: Upload Windows release package
        uses: actions/upload-artifact@v6
        with:
          name: NakedAVP-windows-x64-msvc
          if-no-files-found: error
          path: NakedAVP-windows-x64-msvc.zip

      - name: Upload Windows unpacked package
        uses: actions/upload-artifact@v6
        with:
          name: NakedAVP-windows-x64-msvc-files
          if-no-files-found: error
          path: dist/*
