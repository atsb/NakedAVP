name: Fedora build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Fedora ${{ matrix.fedora_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora_version: ['43', '44']
    container: fedora:${{ matrix.fedora_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          dnf update -y
          dnf install -y             gcc             gcc-c++             cmake             pkgconf-pkg-config             SDL3-devel             ffmpeg-free-devel

      - name: Configure CMake
        run: |
          gcc --version
          cmake --version
          pkg-config --modversion libavformat libavcodec libavutil libswscale libswresample
          cmake -S . -B build -Wdev -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_CXX_COMPILER=g++

      - name: Build ${{ env.BUILD_TYPE }}
        run: cmake --build . --config ${{ env.BUILD_TYPE }} -- -j4
        working-directory: ${{ github.workspace }}/build

      - name: Prepare binary artifact
        run: |
          mkdir -p dist
          cp build/avp dist/NakedAVP
          file dist/NakedAVP
          chmod +x dist/NakedAVP

      - uses: actions/upload-artifact@v6
        with:
          name: NakedAVP-linux-fedora-${{ matrix.fedora_version }}-x86_64
          if-no-files-found: error
          path: dist/NakedAVP
